[package]
name = "raiw-audio"
description = "Audio provenance: decoding through ffmpeg, resampling, spectral processing, quality gates and decoder/codec orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Burn-backed decoders and codecs from raiw-gpu behind the neural traits.
gpu = ["dep:raiw-gpu"]

[dependencies]
raiw-core.workspace = true
raiw-gpu = { workspace = true, optional = true }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
rayon.workspace = true
realfft.workspace = true
tempfile.workspace = true

[dev-dependencies]
raiw-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
