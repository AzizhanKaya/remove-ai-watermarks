[package]
name = "raiw-gpu"
description = "Burn runtime for every neural path: device selection across Vulkan, Metal, DX12 (AMD, NVIDIA, Intel, Apple) and CPU, plus shared layers and weight loading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["wgpu"]
# Portable wgpu: Vulkan (native SPIR-V kernels) on Linux/Windows, Metal on macOS, DX12/WGSL fallback
wgpu = ["burn/wgpu", "burn/vulkan", "gpu-runtime"]
# Pin wgpu to Vulkan
vulkan = ["wgpu"]
# Pin wgpu to Metal with native MSL kernels
metal = ["wgpu", "burn/metal"]
cuda = ["burn/cuda", "gpu-runtime"]
rocm = ["burn/rocm", "gpu-runtime"]
# Fusion, autotuning, and on-disk autotune/kernel caches shared by every CubeCL backend
gpu-runtime = ["burn/fusion", "burn/autotune", "burn/persistence", "burn/cubecl"]

[dependencies]
raiw-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# burn-flex runs single-threaded scalar code without rayon and simd
burn = { workspace = true, features = ["std", "flex", "rayon", "simd"] }
burn-store = { workspace = true, features = ["std", "pytorch", "safetensors"] }
crc32fast.workspace = true
half.workspace = true
realfft.workspace = true
ureq = "3.5.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
raiw-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
base64.workspace = true

[lints]
workspace = true
