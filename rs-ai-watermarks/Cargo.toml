[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/rs-ai-watermarks"]

[workspace.package]
version = "0.75.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["Victor Kuznetsov"]
repository = "https://github.com/wiltodelta/remove-ai-watermarks"
homepage = "https://raiw.cc"

[workspace.dependencies]
# Internal crates
raiw-core = { path = "crates/raiw-core" }
raiw-container = { path = "crates/raiw-container" }
raiw-c2pa = { path = "crates/raiw-c2pa" }
raiw-metadata = { path = "crates/raiw-metadata" }
raiw-text = { path = "crates/raiw-text" }
raiw-cv = { path = "crates/raiw-cv" }
raiw-visible = { path = "crates/raiw-visible" }
raiw-pixel = { path = "crates/raiw-pixel" }
raiw-identify = { path = "crates/raiw-identify" }
raiw-audio = { path = "crates/raiw-audio" }
raiw-video = { path = "crates/raiw-video" }
raiw-classify = { path = "crates/raiw-classify" }
raiw-gpu = { path = "crates/raiw-gpu" }
raiw-regen = { path = "crates/raiw-regen" }
raiw-mcp = { path = "crates/raiw-mcp" }

# Foundations
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2.14.2", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
rayon = "1.12.0"
regex = "1.13.1"
fancy-regex = "0.19.2"
memchr = "2.8.3"
sha2 = "0.11.1"
hex = "0.4.3"
base64 = "0.23.1"
byteorder = "1.5.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
half = { version = "2.7.1", features = ["bytemuck"] }
crc32fast = "1.5.4"
flate2 = "1.1.11"
ciborium = "0.2.2"
quick-xml = "0.42.0"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
tempfile = "3.27.0"
walkdir = "2.5.0"
which = "4.4.2"
getrandom = "0.3"

# Numerics and media
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "rayon"] }
png = "0.18.1"
zune-jpeg = "0.5.15"
ndarray = { version = "0.17.2", features = ["rayon"] }
rustfft = "6.4.1"
realfft = "3.5.1"
num-complex = "0.4.6"
hound = "3.5.1"

# GPU (burn: wgpu runs on Vulkan, Metal, DX12 and WebGPU, so AMD, NVIDIA, Intel and Apple GPUs share one path)
burn = { version = "0.22.1", default-features = false }
burn-store = { version = "0.22.1", default-features = false }

# Tests
approx = "0.5.1"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"
float_cmp = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
opt-level = 2

[profile.bench]
inherits = "release"
